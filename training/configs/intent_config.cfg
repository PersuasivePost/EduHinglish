# ═══════════════════════════════════════════════════════════════════════════
# EduHinglish — Phase 3, Task 4: Intent Config
# ═══════════════════════════════════════════════════════════════════════════
# Pipeline: textcat for student query intent classification
# Default architecture: BOW (recommended for <200 samples)
# Labels: explain_concept, compare_concepts, give_example, formula_request, definition
# max_epochs: 50
# ═══════════════════════════════════════════════════════════════════════════

[paths]
train = "training/data/intent_train.spacy"
dev = "training/data/intent_dev.spacy"
vectors = null

[system]
seed = 42
gpu_allocator = null

[nlp]
lang = "en"
pipeline = ["textcat"]
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
batch_size = 1000
tokenizer = {"@tokenizers": "spacy.Tokenizer.v1"}

# ─── Components ───────────────────────────────────────────────────────────

[components]

[components.textcat]
factory = "textcat"
scorer = {"@scorers": "spacy.textcat_scorer.v2"}

[components.textcat.model]
@architectures = "spacy.TextCatBOW.v2"
exclusive_classes = true
ngram_size = 1
no_output_layer = false

# ─── Corpora ──────────────────────────────────────────────────────────────

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
gold_preproc = false
max_length = 0
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
gold_preproc = false
max_length = 0
limit = 0
augmenter = null

# ─── Training ─────────────────────────────────────────────────────────────

[training]
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.2
accumulate_gradient = 1
patience = 5
max_epochs = 50
max_steps = 0
eval_frequency = 200
frozen_components = []
annotating_components = []
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 1
stop = 32
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 0.00000001
learn_rate = 0.001

[training.score_weights]
textcat_score = 1.0

# ─── Pretraining ──────────────────────────────────────────────────────────

[pretraining]

# ─── Initialization ──────────────────────────────────────────────────────

[initialize]
vectors = ${paths.vectors}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.tokenizer]
